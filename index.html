<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Whiteboard</title>
  
  <!-- PDF.js von CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #e8e4d9; /* leichtes Whiteboard-Beige */
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(0,0,0,0.03) 1px, transparent 1px),
        radial-gradient(circle at 80% 70%, rgba(0,0,0,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      min-height: 100vh;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
      color: #333;
      font-weight: 600;
    }

    /* ===== WHITEBOARD GRID ===== */
    .whiteboard {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 40px 30px;
      max-width: 1200px;
      margin: 0 auto;
      justify-items: center;
    }

    .pdf-card {
      width: 220px;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      position: relative;
    }

    /* leichte zufällige Rotation für realistischen Look */
    .pdf-card:nth-child(3n+1) { transform: rotate(-1.5deg); }
    .pdf-card:nth-child(3n+2) { transform: rotate(1.2deg); }
    .pdf-card:nth-child(3n+3) { transform: rotate(-0.8deg); }

    .pdf-card:hover {
      transform: rotate(0deg) scale(1.05) !important;
      z-index: 10;
    }

    .pdf-card .paper {
      background: white;
      border-radius: 2px;
      box-shadow: 
        0 4px 6px rgba(0,0,0,0.1),
        0 10px 20px rgba(0,0,0,0.08),
        0 0 0 1px rgba(0,0,0,0.05);
      overflow: hidden;
      transition: box-shadow 0.25s ease;
    }

    .pdf-card:hover .paper {
      box-shadow: 
        0 10px 25px rgba(0,0,0,0.15),
        0 20px 40px rgba(0,0,0,0.1);
    }

    .pdf-card canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .pdf-card .title {
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 500;
      color: #333;
      text-align: center;
      background: #fafafa;
      border-top: 1px solid #eee;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== MODAL ===== */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 1000px;
      height: 90vh;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 25px 50px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: #f5f5f5;
      border-bottom: 1px solid #ddd;
    }

    .modal-header h2 {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
      color: #666;
      line-height: 1;
      padding: 0 8px;
    }

    .close-btn:hover {
      color: #000;
    }

    .modal-body {
      flex: 1;
      overflow: hidden;
    }

    .modal-body iframe,
    .modal-body embed {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Loading Spinner */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 280px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>PDF Whiteboard</h1>

  <div class="whiteboard" id="whiteboard">
    <!-- Die Karten werden per JavaScript eingefügt -->
  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <div class="modal-header">
  <h2 id="modal-title">Dokument</h2>
  <div style="display: flex; align-items: center; gap: 12px;">
    <a id="download-btn" href="#" download style="
      background: #2563eb;
      color: white;
      padding: 6px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    ">Download</a>
    <button class="close-btn" id="close-btn">&times;</button>
  </div>
</div>
      <div class="modal-body" id="modal-body">
        <!-- PDF wird hier eingefügt -->
      </div>
    </div>
  </div>

  <script type="module">
    // PDF.js Worker setzen
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

    // ============================================
    // HIER DEINE PDFs EINTRAGEN
    // ============================================
    const pdfs = [
  { title: "34. Rothenburgpokal", url: "20261114_RothenburgpokalU13_U15.pdf" },
  { title: "TopTen U11+U15+U18+U21", url: "20261121_ToptenU11U15U18U21_Tiefenbach.pdf" },
  { title: "TopTen U9+U13", url: "20261122_ToptenU9U13_Tiefenbach.pdf" },
  { title: "Lehrgang U12", url: "20261129_Lehrgang_U12_Altdorf.pdf" },
  { title: "3. Walhalla-Pokal", url: "20261205_Walhalla_Pokal_U12U14_WörthanderDonau.pdf" },
  { title: "Nikolaus Beginner-Meeting", url: "20261206_Nikolaus_Beginner_Meeting_Vohenstrauß.pdf" },
  { title: "30. Judo Sparkassenpokal", url: "20270109_30.Sparkassenpokal_Jena.pdf" },
  { title: "BJV Sichtungsturnier", url: "20270123_24.BJV_Sichtungsturnier_U13_U15_Ingolstadt.pdf" },
      // Weitere PDFs einfach hinzufügen:
      // { title: "Mein Dokument", url: "dokumente/mein-file.pdf" },
    ];

    const whiteboard = document.getElementById('whiteboard');
    const modal = document.getElementById('modal');
    const modalBody = document.getElementById('modal-body');
    const modalTitle = document.getElementById('modal-title');
    const closeBtn = document.getElementById('close-btn');

    // Thumbnail erzeugen
    async function createThumbnail(url) {
      try {
        const loadingTask = pdfjsLib.getDocument(url);
        const pdf = await loadingTask.promise;
        const page = await pdf.getPage(1);

        const scale = 1.5;
        const viewport = page.getViewport({ scale });

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.width = viewport.width;
        canvas.height = viewport.height;

        await page.render({
          canvasContext: context,
          viewport: viewport
        }).promise;

        return canvas;
      } catch (err) {
        console.error('Fehler beim Laden von', url, err);
        return null;
      }
    }

    // Alle Karten erzeugen
    async function buildWhiteboard() {
      for (const pdf of pdfs) {
        const card = document.createElement('div');
        card.className = 'pdf-card';

        const paper = document.createElement('div');
        paper.className = 'paper';

        const loading = document.createElement('div');
        loading.className = 'loading';
        loading.textContent = 'Lädt…';
        paper.appendChild(loading);

        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = pdf.title;

        card.appendChild(paper);
        card.appendChild(title);
        whiteboard.appendChild(card);

        // Thumbnail laden
        const canvas = await createThumbnail(pdf.url);
        if (canvas) {
          paper.innerHTML = '';
          paper.appendChild(canvas);
        } else {
          loading.textContent = 'Fehler';
        }

        // Klick öffnet Modal
        card.addEventListener('click', () => openModal(pdf));
      }
    }

    function openModal(pdf) {
  modalTitle.textContent = pdf.title;
  modalBody.innerHTML = `<embed src="${pdf.url}" type="application/pdf" width="100%" height="100%">`;
  
  // Download-Button setzen
  const downloadBtn = document.getElementById('download-btn');
  downloadBtn.href = pdf.url;
  downloadBtn.download = pdf.title + '.pdf';   // Dateiname beim Download
  
  modal.classList.add('active');
  document.body.style.overflow = 'hidden';
}

    function closeModal() {
      modal.classList.remove('active');
      modalBody.innerHTML = '';
      document.body.style.overflow = '';
    }

    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Start
    buildWhiteboard();
  </script>
</body>
</html>
